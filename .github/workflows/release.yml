name: Release

# Spec §5.2 requires recorded successful full E2E results (real ProteinMPNN/
# LigandMPNN/Boltz-2 install+run) for the exact commit being tagged before a
# release is cut. This workflow does not verify that automatically — it has
# no access to a CUDA host. Tag only after `scheduled-e2e.yml` has been run
# manually against this commit and its results reviewed.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    needs: build-docker-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Published in dependency order: registry -> runtime/adapters -> core -> cli.
      - run: npm publish --workspace @moldesk/registry --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace @moldesk/runtime --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace @moldesk/adapters --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace @moldesk/core --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: npm publish --workspace @moldesk/cli --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build + run smoke test: proves the image builds without depending on
      # committed dist files, and that it actually works (right version,
      # installer tools present) — not just that `docker build` exits 0.
      # No registry login, no push — publishing the image is a separate,
      # explicitly authorized step.
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load --file docker/Dockerfile --tag moldesk/moldesk:smoke-test .
      - run: docker run --rm moldesk/moldesk:smoke-test doctor
      - run: docker run --rm --entrypoint bash moldesk/moldesk:smoke-test -c "which git && which unzip"
      - name: Verify the image reports the tag's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          IMAGE_VERSION=$(docker run --rm moldesk/moldesk:smoke-test --version)
          echo "tag=$TAG_VERSION image=$IMAGE_VERSION"
          [ "$TAG_VERSION" = "$IMAGE_VERSION" ]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Package smoke test: packs every publishable package and installs
      # the tarballs outside the workspace/monorepo checkout, proving no
      # reliance on workspace links, checked-in dist, or root models/.
      - run: npm run pack:verify

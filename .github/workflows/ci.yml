name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node --test scripts/release-lib.test.mjs scripts/worker-release.test.mjs scripts/check-skill-commands.test.mjs
      # Every moldesk command and flag the agent skill mentions must exist in the built CLI, and be documented.
      - run: node scripts/check-skill-commands.mjs
      # The cloud worker bundle recorded in the CLI must match what these sources build.
      - run: node scripts/worker-release.mjs check

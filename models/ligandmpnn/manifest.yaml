schemaVersion: 1
name: ligandmpnn
displayName: LigandMPNN
modelVersion: 0.1.2
adapterVersion: 0.1.0
description: Protein sequence design for protein-ligand and multimer systems (Dauparas et al. 2023).
category: sequence-design
status: beta
license: MIT
homepage: https://github.com/dauparas/LigandMPNN
source:
  repository: https://github.com/dauparas/LigandMPNN
  revision: 26ec57ac976ade5379920dbd43c7f97a91cf82de
runtimes:
  - kind: python
    python: "3.11"
    installer: uv
    # Real, per-platform, PyPI-verified sizes. A single scalar can't
    # represent both accurately: torch's Linux wheel mandatorily pulls ~1.92
    # GiB of NVIDIA CUDA + triton packages that its macOS ARM64 wheel
    # doesn't need at all (same real bundle verified for ProteinMPNN).
    #   darwin-arm64: sum of real macOS ARM64 wheels across every pinned
    #     requirement below (torch, numpy, and the rest) = 130,321,872 B.
    #     (prody has no verified arm64 wheel in this data pull; its x86_64
    #     macOS figure was used as a same-order-of-magnitude proxy.)
    #   linux-x64: sum of real Linux x86_64 wheels across every pinned
    #     requirement (837,600,299 B, dominated by torch 755,552,143 B) +
    #     torch's 11 nvidia-*-cu12 packages + triton (2,013,169,234 B) =
    #     2,850,769,533 B.
    # estimatedDiskBytes(ByPlatform) is an approximate 2x multiplier for
    # unpacked venv overhead, not a measured value.
    estimatedDownloadBytesByPlatform:
      darwin-arm64: 130321872
      linux-x64: 2850769533
    estimatedDiskBytesByPlatform:
      darwin-arm64: 260643744
      linux-x64: 5701539066
    requirements:
      - name: biopython
        version: "1.79"
      - name: filelock
        version: 3.13.1
      - name: fsspec
        version: 2024.3.1
      - name: Jinja2
        version: 3.1.3
      - name: MarkupSafe
        version: 2.1.5
      - name: ml-collections
        version: 0.1.1
      - name: dm-tree
        version: 0.1.8
      - name: torch
        version: 2.2.1
      - name: numpy
        version: "1.23.5"
      - name: prody
        version: 2.4.1
      - name: pyparsing
        version: 3.1.1
      - name: scipy
        version: 1.12.0
      # prody imports pkg_resources at import time; uv-managed Python 3.11 venvs
      # don't bundle setuptools by default, so it must be pinned explicitly.
      - name: setuptools
        version: 69.1.1
assets:
  - id: ligandmpnn-checkpoint
    url: https://files.ipd.uw.edu/pub/ligandmpnn/ligandmpnn_v_32_010_25.pt
    source: LigandMPNN upstream model parameter distribution
    license: MIT
    sha256: 161cd264061fda9680cbb940255522ae42f2966c552d045d87913d9452a80970
    target: model_params/ligandmpnn_v_32_010_25.pt
    sizeBytes: 10541943
    archive: none
hardware:
  platforms:
    - darwin-arm64
    - linux-x64
input:
  formats:
    - .pdb
  required: true
outputs:
  - id: sequences
    glob: "seqs/*.fa"
    required: true
